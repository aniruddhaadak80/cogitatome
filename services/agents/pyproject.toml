[project]
name = "cogitatome-agents"
version = "0.1.0"
description = "cogitatome heavy interpretability worker: sparse-autoencoder training, logit attribution, linear probes, activation-patching sweeps and an offline corpus search. Deterministic, numpy-only, zero API keys."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "cogitatome contributors" }]
keywords = ["interpretability", "alignment", "sparse-autoencoder", "probes", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
# Pinned upper bounds keep the Docker build reproducible. Ranges allow patch
# releases; exact versions are mirrored in requirements.txt for the image.
dependencies = [
  "fastapi>=0.115,<1.0",
  "starlette>=0.40,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "numpy>=1.26,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/cogitatome/cogitatome"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cogitatome_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
