name: rust

on:
  push:
    branches: [main, develop]
    paths: ["crates/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", ".github/workflows/rust.yml"]

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/engine -> target
      - run: cargo fmt --manifest-path crates/engine/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path crates/engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/engine/Cargo.toml
      - run: cargo build --manifest-path crates/engine/Cargo.toml --release
